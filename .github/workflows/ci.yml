# Tests on every push and pull request. Linux only, by the plan's own decision (§1): the
# server is Linux, and a three-OS matrix was one of the things v2 dropped as cost without
# a matching risk. Development happens on Windows, so a few filesystem tests skip there and
# run here -- which is the other reason this exists.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    name: the workflows themselves parse
    # First, and on its own, because of how this file failed once: a `run:` block with a raw
    # newline inside a quoted shell string made the whole file unparseable, so GitHub failed
    # every run with "No jobs were run" -- not one job, not even the tests. A workflow cannot
    # test itself once it is broken, so this is checked from the suite as well.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_workflows.py -q

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, and a current release. Debian 12 -- what most
        # VPS run, and what the testbed uses -- ships 3.11, so that one is not academic.
        python: ["3.11", "3.13"]
    name: pytest on Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: run the suite
        # The performance checks are marked slow and excluded by pyproject.toml. They measure
        # the plan's numeric criteria, and a shared runner cannot measure anything.
        run: python -m pytest

  package:
    runs-on: ubuntu-latest
    name: installs as a package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # A plain, non-editable install of the built wheel: this is what a user gets, and it
      # breaks in ways an editable install never shows -- a missing package, a bad entry point.
      - run: python -m pip install .
      - run: hvk --version
      - name: it answers against a vault it has never seen
        run: |
          mkdir -p /tmp/vault/.obsidian
          echo '{}' > /tmp/vault/.obsidian/app.json
          printf '# One\n\nLinks to [[Two]].\n' > /tmp/vault/One.md
          printf '# Two\n' > /tmp/vault/Two.md
          hvk --vault /tmp/vault scan
          hvk --vault /tmp/vault backlinks Two --json | grep -q One.md

  uv-tool:
    runs-on: ubuntu-latest
    name: installs the way the README says to
    steps:
      - uses: actions/checkout@v7
      # The README and the guide both tell a stranger to install with `uv tool install`, and
      # until this existed the only route CI proved was pip's. They are not the same: uv builds
      # an isolated environment and puts a launcher on PATH, which is where an entry point or a
      # missing package shows up differently.
      #
      # Pinned to an exact release, not a floating major. astral-sh stopped publishing `@v8`
      # and `@v8.0`-style tags from v8.0.0 onwards, deliberately, so that a compromised action
      # cannot be pushed under a tag somebody already trusts.
      - uses: astral-sh/setup-uv@v10.0.1
      - name: install this checkout as a tool
        run: uv tool install --from . headless-vault-kit
      - name: it is on PATH and answers
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          hvk --version
          mkdir -p /tmp/uv-vault/.obsidian
          echo '{}' > /tmp/uv-vault/.obsidian/app.json
          printf '# One\n\nLinks to [[Two]].\n' > /tmp/uv-vault/One.md
          printf '# Two\n' > /tmp/uv-vault/Two.md
          hvk --vault /tmp/uv-vault scan
          hvk --vault /tmp/uv-vault backlinks Two --json | grep -q One.md
      - name: it speaks MCP
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          } | hvk --vault /tmp/uv-vault mcp | grep -q '"backlinks"'

  scripts:
    runs-on: ubuntu-latest
    name: shell scripts parse
    steps:
      - uses: actions/checkout@v7
      # Syntax only. The deployment is exercised for real in tools/testbed/, which needs a
      # systemd user instance and a container to throw away, and neither belongs here.
      - name: bash -n every script
        run: |
          for script in deploy/*.sh deploy/bin/*.sh tools/testbed/*.sh; do
            echo "checking $script"
            bash -n "$script"
          done
      # Development happens on Windows, where the executable bit does not exist, so a new
      # script arrives at 100644 unless somebody remembers. Nobody remembers, and the symptom
      # is "Permission denied" on the first line of the runbook, for a stranger, on Linux.
      - name: every script is executable
        run: |
          # Checked on disk rather than through git, because what matters is the file a
          # stranger ends up with after cloning, and because a check that depends on the
          # runner's git state fails for reasons that have nothing to do with the bit.
          not_executable=$(find . -path ./.git -prune -o -name '*.sh' -type f ! -perm -u+x -print)
          if [ -n "$not_executable" ]; then
            echo "not executable after checkout; fix with: git update-index --chmod=+x <file>"
            echo "$not_executable"
            exit 1
          fi
          echo "every .sh is executable after a clone"
