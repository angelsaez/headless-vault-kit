# Publishing to PyPI, triggered by a tag.
#
# There is no API token anywhere in this repository, and there is not meant to be. PyPI's
# trusted publishing gives this workflow a short-lived identity over OIDC, scoped to this
# repository, this workflow file and this environment; a token in a secret is a long-lived
# credential that can be copied, and the thing it publishes is code other people install.
#
# The suite runs first and the job that publishes depends on it. A release that fails its own
# tests is the one kind of mistake PyPI cannot undo: a version number is never reusable.
name: release

on:
  push:
    tags: ["v*"]
  # Building without publishing, on demand: this is the rehearsal, and ADR-0013 is the reason
  # there is one. A backup is what you restored; a release is what you built and installed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    name: the suite has to pass first
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  build:
    runs-on: ubuntu-latest
    needs: tests
    name: build and check the distribution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build twine
      - run: python -m build
      - name: the metadata PyPI will render
        run: python -m twine check dist/*
      - name: the tag and the version have to agree
        # A tag saying v0.2.0 on a tree whose pyproject.toml still says 0.1.0 publishes 0.1.0,
        # or fails because that version is taken. Neither is discoverable afterwards.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag $tagged, pyproject $declared"
          test "$tagged" = "$declared"
      - name: what an installer actually gets
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/hvk --version
          mkdir -p /tmp/rel-vault/.obsidian
          echo '{}' > /tmp/rel-vault/.obsidian/app.json
          printf '# One\n\nLinks to [[Two]].\n' > /tmp/rel-vault/One.md
          printf '# Two\n' > /tmp/rel-vault/Two.md
          /tmp/fresh/bin/hvk --vault /tmp/rel-vault scan
          /tmp/fresh/bin/hvk --vault /tmp/rel-vault backlinks Two --json | grep -q One.md
      # Pinned exactly, not to a floating major. This workflow ends in `id-token: write` and
      # publishes something other people install, and the action this project trusted yesterday
      # is not necessarily the code behind that tag tomorrow -- which is the advice
      # gh-action-pypi-publish gives about its own dependencies. It is also how the floating
      # `@v4` used here at first turned out not to exist any more.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: distribution
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    name: publish to PyPI
    # Only a tag publishes. workflow_dispatch builds and stops, which is the rehearsal.
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/headless-vault-kit
    permissions:
      id-token: write        # the whole of the authentication: no token, no secret
    steps:
      # v8 here and v7 above is not a mistake: the two actions version independently.
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
